<!doctype html>
<html lang="en" background="#151313">
    <head>
        <meta charset="UTF-8" />
        <script>
            // Unregister obsolete service workers in LieCord mobile / app
            if (typeof window !== "undefined" && (navigator.userAgent.includes("LieCord") || window.location.search.includes("nocache"))) {
                if ("serviceWorker" in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function(regs) {
                        for (var i = 0; i < regs.length; i++) regs[i].unregister();
                    });
                }
                if ("caches" in window) {
                    caches.keys().then(function(names) {
                        for (var i = 0; i < names.length; i++) caches.delete(names[i]);
                    });
                }
            }
        </script>

        <!--App Title-->
        <title>LieCord</title>
        <meta name="apple-mobile-web-app-title" content="LieCord" />

        <!--App Scaling-->
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />

        <!--App Icons-->
        <link
            rel="apple-touch-icon"
            href="public/assets/icons/apple-touch.png"
        />
        <link rel="icon" type="image/png" href="/assets/logo_round.png" />

        <!--Splash Screens for iOS Devices-->

            href="public/assets/splashscreens/iphone5_splash.png"

            rel="apple-touch-startup-image"

            rel="apple-touch-startup-image"
        />
        <link
            href="public/assets/splashscreens/iphoneplus_splash.png"
            media="(device-width: 621px) and (device-height: 1104px) and (-webkit-device-pixel-ratio: 3)"

        />
        <link
            href="public/assets/splashscreens/iphonex_splash.png"

        <!--CSS for noscript screen-->
        <style>
            noscript {
                background: #151313;
                color: #E7E1E1;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                user-select: none;
            }
            noscript > div {
                padding: 12px;
                display: flex;
                font-family: Roboto, sans-serif;
                flex-direction: column;
                justify-content: center;
                text-align: center;
            }
            noscript > div > h1 {
                margin: 8px 0;
                text-transform: uppercase;
                font-size: 20px;
                font-weight: 700;
            }
            noscript > div > p {
                margin: 4px 0;
                font-size: 14px;
                color: #D1C3C4;
            }
            noscript > div > a {
                align-self: center;
                margin-top: 20px;
                padding: 8px 16px;
                font-size: 14px;
                font-weight: 600;
                background: #D8C0C3;
                border-radius: 16px;
                text-decoration: none;
                color: #151313;
                transition: opacity 0.2s;
            }
            noscript > div > a:hover {
                opacity: 0.9;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.tsx"></script>
        <noscript>
            <div>
                <img src="disabled-js.svg" />
                <h1>Well, this is really awkward...</h1>
                <p>Seems like your JavaScript is disabled.</p>
                <p>You'll need to enable JavaScript to run LieCord.</p>
                <a href="https://cord.lie2srvv.com" target="_blank">Reload</a>
            </div>
        </noscript>
    </body>
</html>
