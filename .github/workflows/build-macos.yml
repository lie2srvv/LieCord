name: Build LieCord Desktop for macOS

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build macOS (${{ matrix.arch }})
        working-directory: desktop
        run: npm run make -- --platform darwin --arch ${{ matrix.arch }}

      - name: Upload macOS Artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: LieCord-macOS-${{ matrix.arch }}
          path: |
            desktop/out/make/**/*.dmg
            desktop/out/make/**/*.zip
