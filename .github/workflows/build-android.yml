name: Build LieCord Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create stoatbuild.properties and google-services.json
        run: |
          echo "sentry.dsn=" > android/stoatbuild.properties
          echo "sentry.upload_mappings=false" >> android/stoatbuild.properties
          echo "build.debug.app_name=LieCord" >> android/stoatbuild.properties
          echo "build.flavour_id=LIECORD" >> android/stoatbuild.properties
          sed -e 's/chat\.revolt\.debug/com.lie2srvv.liecord.debug/g' \
              -e 's/chat\.revolt/com.lie2srvv.liecord/g' \
              android/app/google-services.json.example > android/app/google-services.json

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: LieCord-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
